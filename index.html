<title>Resurrection Fest EG 2026</title>
<style>
:root {
  --bg: #0a0a0e;
  --bg2: #14141c;
  --card: #1b1b25;
  --line: #2a2a38;
  --text: #f2f2f5;
  --muted: #9a9aae;
  --accent: #e63946;
  --main: #e63946;
  --ritual: #2f80ed;
  --chaos: #b5179e;
  --desert: #e8932b;
  --spotify: #1db954;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

body { padding-bottom: 92px; }

header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 14px));
  background: linear-gradient(180deg, #101018 0%, rgba(16,16,24,.92) 100%);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}

.brand {
  font-weight: 800;
  letter-spacing: .14em;
  font-size: 13px;
  line-height: 1.2;
}
.brand span { color: var(--accent); }

.clock {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.clock .t { font-size: 19px; font-weight: 700; }
.clock .d { font-size: 11px; color: var(--muted); text-transform: capitalize; }

main { padding: 16px; max-width: 720px; margin: 0 auto; }

.section-title {
  font-size: 12px;
  letter-spacing: .18em;
  color: var(--muted);
  margin: 22px 2px 10px;
  text-transform: uppercase;
}
.section-title:first-child { margin-top: 4px; }

/* band finder */
.finder {
  margin-bottom: 8px;
}
.searchbar {
  position: relative;
  display: flex;
  align-items: center;
}
.searchbar input {
  width: 100%;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  color: var(--text);
  font: inherit;
  font-size: 16px;
  font-weight: 650;
  outline: none;
  padding: 0 44px 0 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,.03) inset;
}
.searchbar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(230,57,70,.2);
}
.searchbar input::placeholder { color: #77778c; font-weight: 600; }
.clearsearch {
  position: absolute;
  right: 7px;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 10px;
  background: var(--line);
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
}
.clearsearch[hidden] { display: none; }
.searchresults {
  margin-top: 8px;
}
.searchresult {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  background: var(--card);
  color: inherit;
  text-align: left;
  font: inherit;
}
.searchresult:active { background: #20202c; transform: scale(.99); }
.searchresult .when {
  min-width: 58px;
  font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.searchresult .when small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}
.searchresult .matchbody { flex: 1; min-width: 0; }
.searchresult .matchname {
  overflow-wrap: anywhere;
  font-size: 15px;
  font-weight: 800;
}
.searchresult .matchmeta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}
.searchresult .arrow {
  color: var(--muted);
  font-size: 19px;
  font-weight: 800;
}

/* NOW cards */
.nowcard {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 14px;
  padding: 14px 14px 12px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
.nowcard:active { transform: scale(.99); }
.nowcard .stage {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.nowcard .artist { font-size: 22px; font-weight: 800; margin: 3px 0 6px; }
.nowcard .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.nowcard .left { color: var(--text); font-weight: 600; }
.progress { height: 4px; background: var(--line); border-radius: 4px; margin-top: 11px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.nowcard .spot { position: absolute; top: 12px; right: 12px; font-size: 11px; color: var(--spotify); font-weight: 700; }

.empty {
  background: var(--bg2);
  border: 1px dashed var(--line);
  border-radius: 14px;
  padding: 18px 16px;
  color: var(--muted);
  font-size: 14px;
}
.empty b { color: var(--text); }

/* day tabs */
.days {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 4px;
  scrollbar-width: none;
}
.days::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--muted);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}
.day.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.day.today::after { content: "•"; margin-left: 6px; color: var(--spotify); }

/* schedule list */
.slot {
  display: flex;
  align-items: stretch;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  padding: 11px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
}
.slot:active { background: #20202c; }
.slot.live { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.slot.focus { border-color: var(--spotify); box-shadow: 0 0 0 1px var(--spotify) inset; opacity: 1; }
.slot.past { opacity: .42; }
.slot .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; min-width: 44px; }
.slot .time small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.slot .body { flex: 1; min-width: 0; }
.slot .name { font-weight: 700; font-size: 15px; }
.slot .sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
.chip { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; color: #0a0a0e; }
.slot .go { align-self: center; color: var(--spotify); font-size: 18px; }
.slot.live .badge { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: .1em; }

/* floating day button */
.daybtn {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: 688px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 54px;
  background: var(--spotify);
  color: #04210f;
  font-weight: 800;
  font-size: 15px;
  text-decoration: none;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
  z-index: 30;
}
.daybtn.disabled { background: var(--bg2); color: var(--muted); border: 1px solid var(--line); }
.daybtn svg { width: 20px; height: 20px; }

.countdown { font-size: 13px; color: var(--muted); margin-top: 6px; }
.countdown b { color: var(--text); font-size: 16px; }

/* view toggle (Lista / Parrilla) */
.viewtoggle { display: flex; gap: 6px; margin: 0 0 12px; }
.viewtoggle button {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--line);
  background: var(--bg2);
  color: var(--muted);
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
}
.viewtoggle button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* grid / parrilla */
.grid { font-size: 11px; }
.grow { display: flex; }
.gaxiscell, .gaxis { width: 36px; flex: 0 0 36px; }
.ghead { margin-bottom: 2px; }
.gstage {
  flex: 1;
  text-align: center;
  font-weight: 800;
  font-size: 10px;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: #0a0a0e;
  padding: 5px 2px;
  margin: 0 1px;
  border-radius: 7px 7px 0 0;
}
.gbody { position: relative; }
.gaxis { position: relative; }
.ghour {
  position: absolute;
  right: 5px;
  transform: translateY(-6px);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 10px;
}
.gcol {
  flex: 1;
  position: relative;
  margin: 0 1px;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.015) 0,
    rgba(255,255,255,.015) 77px,
    var(--line) 77px,
    var(--line) 78px
  );
}
.gblock {
  position: absolute;
  left: 0;
  right: 0;
  border-radius: 6px;
  padding: 3px 5px;
  overflow: hidden;
  color: #fff;
  text-decoration: none;
  display: block;
  box-shadow: 0 1px 3px rgba(0,0,0,.45);
}
.gblock:active { filter: brightness(1.1); }
.gblock .gname { display: block; font-weight: 800; font-size: 11px; line-height: 1.05; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.gblock .gtime2 { display: block; font-size: 9px; opacity: .85; margin-top: 1px; font-variant-numeric: tabular-nums; }
.gblock.past { opacity: .5; }
.gblock.live { outline: 2px solid #fff; outline-offset: -2px; z-index: 3; }
.gnow {
  position: absolute;
  left: 36px;
  right: 0;
  height: 2px;
  background: #fff;
  z-index: 4;
  box-shadow: 0 0 7px rgba(255,255,255,.9);
}
.gnow::before {
  content: "";
  position: absolute;
  left: -1px;
  top: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
}

</style>
</head>

  }
  function getNow() {
    var p = new URLSearchParams(location.search).get("now");
    if (p) { var d = new Date(p); if (!isNaN(d)) return d; }
    var s = safeStorageGet("resu-demo");
    if (s) { var d2 = new Date(s); if (!isNaN(d2)) return d2; }
    return new Date();
  }

  function dayList() {
    var seen = {}, out = [];
    EVENTS.forEach(function (e) {
      if (!seen[e.day_label]) { seen[e.day_label] = true; out.push(e.day_label); }
    });
    return out;
  }
  function eventsForDay(day) {
    return EVENTS.filter(function (e) { return e.day_label === day; });
  }
  function eventKey(e) {
    return e.starts_at + "|" + e.artist;
  }
  function isLive(e, now) {
    return new Date(e.starts_at) <= now && now < new Date(e.ends_at);
  }
  function isReal(e) { return !/^band contest$/i.test(e.artist); }

  function livePerStage(now) {
    var map = {};
    EVENTS.forEach(function (e) { if (isLive(e, now)) map[e.stage] = e; });
    return map;
  }
  function nextUp(now) {
    var up = EVENTS.filter(function (e) { return new Date(e.starts_at) > now && isReal(e); });
    return up.length ? up[0] : null;
  }
  function currentDay(now) {
    var live = EVENTS.filter(function (e) { return isLive(e, now); });
    if (live.length) return live[0].day_label;
    var n = nextUp(now);
    if (n) return n.day_label;
    return dayList()[0];
  }

  // ---- spotify links -------------------------------------------------------
  function dayTarget(day) { return MAP.days && MAP.days[day]; }
  function artistTarget(artist) { return MAP.artists && MAP.artists[artist]; }
  function hrefForEvent(e) {
    var t = artistTarget(e.artist) || dayTarget(e.day_label);
    if (t && t.id) return "spotify:playlist:" + t.id;
    if (t && t.url) return t.url;
    return null;
  }
  function hrefForDay(day) {
    var t = dayTarget(day);
    if (t && t.id) return "spotify:playlist:" + t.id;
    if (t && t.url) return t.url;
    return null;
  }

  // ---- rendering -----------------------------------------------------------
  var state = { selectedDay: null, userPicked: false, view: "grid", focusKey: "" };

  function renderClock(now) {
    var el = document.getElementById("clock");
    var t = new Intl.DateTimeFormat("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: TZ }).format(now);
    var d = fmtDateLong(now);
    el.innerHTML = '<div class="t">' + t + '</div><div class="d">' + d + "</div>";
  }

  function nowCardHTML(e, now) {
    var start = new Date(e.starts_at), end = new Date(e.ends_at);
    var pct = Math.max(0, Math.min(1, (now - start) / (end - start))) * 100;
    var leftMin = Math.max(0, Math.round((end - now) / 60000));
    var href = hrefForEvent(e);
    var tag = href ? "a" : "div";
    var hattr = href ? ' href="' + href + '"' : "";
    var col = stageColor(e.stage);
    return "<" + tag + ' class="nowcard"' + hattr + ' style="border-left-color:' + col + '">' +
      (href ? '<span class="spot">SPOTIFY ▸</span>' : "") +
      '<div class="stage" style="color:' + col + '">' + e.stage + "</div>" +
      '<div class="artist">' + e.artist + "</div>" +
      '<div class="meta"><span class="left">Quedan ' + leftMin + " min</span><span>" +
      fmtTime(e.starts_at) + "–" + fmtTime(e.ends_at) + "</span></div>" +
      '<div class="progress"><i style="width:' + pct.toFixed(1) + "%;background:" + col + '"></i></div>' +
      "</" + tag + ">";
  }

  function renderNow(now) {
    var host = document.getElementById("now");
    var html = '<div class="section-title">Ahora mismo</div>';
    var live = livePerStage(now);
    var stages = STAGE_ORDER.filter(function (s) { return live[s] && isReal(live[s]); });

    if (stages.length) {
      stages.forEach(function (s) { html += nowCardHTML(live[s], now); });
    } else {
      var fest = SCHEDULE.festival || {};
      var firstStart = new Date(EVENTS[0].starts_at);
      var n = nextUp(now);
      if (now < firstStart) {
        var days = Math.ceil((firstStart - now) / 86400000);
        html += '<div class="empty"><b>El festival aún no ha empezado.</b>' +
          '<div class="countdown">Faltan <b>' + days + "</b> día" + (days === 1 ? "" : "s") +
          " · arranca " + fmtDateLong(firstStart) + "</div></div>";
      } else if (n) {
        html += '<div class="empty">Ahora no hay nada en directo.<br>Próximo: <b>' + n.artist +
          "</b> en " + n.stage + " a las " + fmtTime(n.starts_at) + ".</div>";
        html += nextSlim(n);
      } else {
        html += '<div class="empty"><b>Festival terminado.</b> ¡Hasta el año que viene!</div>';
      }
    }
    host.innerHTML = html;
  }

  function nextSlim(e) {
    var href = hrefForEvent(e);
    var tag = href ? "a" : "div";
    var hattr = href ? ' href="' + href + '"' : "";
    var col = stageColor(e.stage);
    return "<" + tag + ' class="nowcard"' + hattr + ' style="border-left-color:' + col + '">' +
      (href ? '<span class="spot">SPOTIFY ▸</span>' : "") +
      '<div class="stage" style="color:' + col + '">Siguiente · ' + e.stage + "</div>" +
      '<div class="artist">' + e.artist + "</div>" +
      '<div class="meta"><span>' + fmtTime(e.starts_at) + "–" + fmtTime(e.ends_at) + "</span></div></" + tag + ">";
  }

  function renderDays(now) {
    var host = document.getElementById("days");
    var today = currentDay(now);
    host.innerHTML = dayList().map(function (day) {
      var cls = "day";
      if (day === state.selectedDay) cls += " active";
      if (day === today) cls += " today";
      return '<button class="' + cls + '" data-day="' + day + '">' + day + "</button>";
    }).join("");
    Array.prototype.forEach.call(host.querySelectorAll(".day"), function (btn) {
      btn.addEventListener("click", function () {
        state.selectedDay = btn.getAttribute("data-day");
        state.userPicked = true;
        renderAll();
      });
    });
  }

  function listHTML(now) {
    return eventsForDay(state.selectedDay).map(function (e) {
      var href = hrefForEvent(e);
      var live = isLive(e, now);
      var past = new Date(e.ends_at) <= now;
      var cls = "slot" + (live ? " live" : past ? " past" : "");
      if (state.focusKey === eventKey(e)) cls += " focus";
      var tag = href ? "a" : "div";
      var hattr = (href ? ' href="' + href + '"' : "") + ' data-key="' + escapeHTML(eventKey(e)) + '"';
      var col = stageColor(e.stage);
      return "<" + tag + ' class="' + cls + '"' + hattr + ">" +
        '<div class="time">' + fmtTime(e.starts_at) + "<small>" + fmtTime(e.ends_at) + "</small></div>" +
        '<div class="body"><div class="name">' + e.artist + "</div>" +
        '<div class="sub"><span class="chip" style="background:' + col + '">' + e.stage + "</span>" +
        (live ? '<span class="badge">● EN DIRECTO</span>' : "") + "</div></div>" +
        (href ? '<div class="go">▸</div>' : "") +
        "</" + tag + ">";
    }).join("");
  }

  function gridHTML(now) {
    var list = eventsForDay(state.selectedDay);
    if (!list.length) return "";
    var startMs = list.map(function (e) { return +new Date(e.starts_at); });
    var endMs = list.map(function (e) { return +new Date(e.ends_at); });
    var dayStart = new Date(Math.min.apply(null, startMs));
    dayStart.setMinutes(0, 0, 0);
    var dayEnd = new Date(Math.max.apply(null, endMs));
    if (dayEnd.getMinutes() || dayEnd.getSeconds()) {
      dayEnd.setMinutes(0, 0, 0);
      dayEnd.setHours(dayEnd.getHours() + 1);
    }
    var PXMIN = 1.3;
    var H = (dayEnd - dayStart) / 60000 * PXMIN;
    function top(ms) { return (ms - dayStart) / 60000 * PXMIN; }

    var axis = "";
    for (var t = +dayStart; t <= +dayEnd; t += 3600000) {
      axis += '<div class="ghour" style="top:' + top(t) + 'px">' + fmtTime(new Date(t).toISOString()) + "</div>";
    }

    var cols = STAGE_ORDER.map(function (stage) {
      var blocks = list.filter(function (e) { return e.stage === stage; }).map(function (e) {
        var s = +new Date(e.starts_at), en = +new Date(e.ends_at);
        var live = isLive(e, now);
        var past = en <= +now;
        var href = hrefForEvent(e);
        var tag = href ? "a" : "div";
        var hattr = href ? ' href="' + href + '"' : "";
        var col = stageColor(e.stage);
        var h = (en - s) / 60000 * PXMIN;
        var cls = "gblock" + (live ? " live" : past ? " past" : "");
        return "<" + tag + ' class="' + cls + '"' + hattr +
          ' style="top:' + top(s) + "px;height:" + (h - 2) + "px;background:" + col + '">' +
          '<span class="gname">' + e.artist + "</span>" +
          '<span class="gtime2">' + fmtTime(e.starts_at) + "</span></" + tag + ">";
      }).join("");
      return '<div class="gcol">' + blocks + "</div>";
    }).join("");

    var showNow = +now >= +dayStart && +now <= +dayEnd;
    var nowLine = showNow ? '<div class="gnow" style="top:' + top(+now) + 'px"></div>' : "";

    return '<div class="grid">' +
      '<div class="grow ghead"><div class="gaxiscell"></div>' +
      STAGE_ORDER.map(function (s) {
        return '<div class="gstage" style="background:' + stageColor(s) + '">' + s + "</div>";
      }).join("") +
      "</div>" +
      '<div class="grow gbody" style="height:' + H + 'px">' +
      '<div class="gaxis">' + axis + "</div>" + cols + nowLine +
      "</div></div>";
  }

  function renderSchedule(now) {
    var host = document.getElementById("schedule");
    var toggle = '<div class="viewtoggle">' +
      '<button data-v="grid" class="' + (state.view === "grid" ? "on" : "") + '">Parrilla</button>' +
      '<button data-v="list" class="' + (state.view === "list" ? "on" : "") + '">Lista</button>' +
      "</div>";
    var body = state.view === "grid" ? gridHTML(now) : listHTML(now);
    host.innerHTML = '<div class="section-title">' + state.selectedDay + " · cartel</div>" + toggle + body;
    Array.prototype.forEach.call(host.querySelectorAll(".viewtoggle button"), function (btn) {
      btn.addEventListener("click", function () {
        state.view = btn.getAttribute("data-v");
        renderAll();
      });
    });
  }

  function searchEvents(query) {
    var q = normalizeSearch(query);
    if (q.length < 2) return [];
    var terms = q.split(/\s+/).filter(Boolean);
    return EVENTS.filter(isReal).map(function (e) {
      var artist = normalizeSearch(e.artist);
      var compactArtist = artist.replace(/\s+/g, "");
      var compactQuery = q.replace(/\s+/g, "");
      if (!terms.every(function (term) { return artist.indexOf(term) !== -1 || compactArtist.indexOf(term) !== -1; })) return null;
      var score = 10;
      if (artist === q || compactArtist === compactQuery) score += 90;
      else if (artist.indexOf(q) === 0 || compactArtist.indexOf(compactQuery) === 0) score += 50;
      else if (artist.indexOf(q) !== -1 || compactArtist.indexOf(compactQuery) !== -1) score += 25;
      score += Math.max(0, 20 - artist.length / 2);
      return { event: e, score: score };
    }).filter(Boolean).sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return new Date(a.event.starts_at) - new Date(b.event.starts_at);
    }).slice(0, 8).map(function (item) { return item.event; });
  }

  function renderSearchResults(query) {
    var host = document.getElementById("searchResults");
    var clear = document.getElementById("clearSearch");
    if (!host) return;
    var q = query || "";
    if (clear) clear.hidden = q.length === 0;
    if (normalizeSearch(q).length < 2) {
      host.innerHTML = "";
      return;
    }
    var matches = searchEvents(q);
    if (!matches.length) {
      host.innerHTML = '<div class="empty">No encuentro esa banda.</div>';
      return;
    }
    host.innerHTML = matches.map(function (e) {
      var col = stageColor(e.stage);
      return '<button class="searchresult" type="button" data-day="' + escapeHTML(e.day_label) + '" data-key="' + escapeHTML(eventKey(e)) + '" style="border-left-color:' + col + '">' +
        '<div class="when">' + fmtTime(e.starts_at) + '<small>' + escapeHTML(e.day_label) + '</small></div>' +
        '<div class="matchbody"><div class="matchname">' + escapeHTML(e.artist) + '</div>' +
        '<div class="matchmeta"><span class="chip" style="background:' + col + '">' + escapeHTML(e.stage) + '</span>' +
        '<span>' + fmtTime(e.starts_at) + "-" + fmtTime(e.ends_at) + '</span></div></div>' +
        '<div class="arrow">&rsaquo;</div></button>';
    }).join("");
    Array.prototype.forEach.call(host.querySelectorAll(".searchresult"), function (btn) {
      btn.addEventListener("click", function () {
        state.selectedDay = btn.getAttribute("data-day");
        state.focusKey = btn.getAttribute("data-key") || "";
        state.userPicked = true;
        state.view = "list";
        renderAll();
        setTimeout(function () {
          var target = document.querySelector('.slot.focus');
          if (target && target.scrollIntoView) {
            target.scrollIntoView({ block: "center" });
            return;
          }
          var schedule = document.getElementById("schedule");
          if (schedule && schedule.scrollIntoView) schedule.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 0);
      });
    });
  }

  function setupSearch() {
    var input = document.getElementById("bandSearch");
    var clear = document.getElementById("clearSearch");
    if (!input) return;
    input.addEventListener("input", function () { renderSearchResults(input.value); });
    if (clear) {
      clear.addEventListener("click", function () {
        input.value = "";
        input.focus();
        renderSearchResults("");
      });
    }
  }

  function renderDayButton() {
    var btn = document.getElementById("dayBtn");
    var href = hrefForDay(state.selectedDay);
    var icon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm4.5 14.4a.62.62 0 01-.86.21c-2.35-1.44-5.3-1.76-8.8-.96a.62.62 0 11-.28-1.21c3.82-.88 7.1-.5 9.73 1.1.3.18.39.57.21.86zm1.2-2.67a.78.78 0 01-1.07.26c-2.69-1.65-6.79-2.13-9.97-1.16a.78.78 0 11-.45-1.49c3.63-1.1 8.15-.57 11.23 1.32.37.23.49.71.26 1.07zm.1-2.78C14.87 9.36 9.4 9.18 6.3 10.12a.93.93 0 11-.54-1.79c3.56-1.08 9.6-.87 13.18 1.25a.94.94 0 01-.95 1.61z"/></svg>';
    if (href) {
      btn.className = "daybtn";
      btn.setAttribute("href", href);
      btn.innerHTML = icon + "Playlist " + state.selectedDay;
    } else {
      btn.className = "daybtn disabled";
      btn.removeAttribute("href");
      btn.innerHTML = "Genera la playlist de " + state.selectedDay;
    }
  }

  function renderAll() {
    var now = getNow();
    if (!state.selectedDay || !state.userPicked) state.selectedDay = currentDay(now);
    renderClock(now);
    renderNow(now);
    renderDays(now);
    renderSchedule(now);
    renderDayButton();
  }
  function registerOfflineCache() {
    var local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    if (!("serviceWorker" in navigator) || (location.protocol !== "https:" && !local)) return;
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (err) {
        try { console.warn("Offline cache unavailable", err); } catch (e) {}
      });
    });
  }

  registerOfflineCache();

  // demo time: tap the clock to simulate a moment (helps testing before July)
  document.addEventListener("DOMContentLoaded", function () {
    setupSearch();
    try { renderAll(); }
    catch (err) { showBootError(err); return; }
    setInterval(function () {
      try { renderAll(); }
      catch (err) { showBootError(err); }
    }, 20000);
    var clock = document.getElementById("clock");
    if (clock) {
      clock.addEventListener("click", function () {
        var cur = safeStorageGet("resu-demo") || "";
        var v = prompt("Simular fecha/hora (ISO, ej. 2026-07-03T21:30). Vacío = hora real:", cur);
        if (v === null) return;
        if (v.trim() === "") safeStorageRemove("resu-demo");
        else safeStorageSet("resu-demo", v.trim());
        state.userPicked = false;
        try { renderAll(); }
        catch (err) { showBootError(err); }
      });
    }
  });
})();

</script>
</body>
